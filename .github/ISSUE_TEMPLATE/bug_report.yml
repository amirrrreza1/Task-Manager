name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove credentials, private task content, and uploaded files before submitting.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: "1. Sign in as…\n2. Open…\n3. Select…"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Task Manager version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Deployment and browser details
  - type: checkboxes
    id: security
    attributes:
      label: Security check
      options:
        - label: This report does not describe a security vulnerability.
          required: true
